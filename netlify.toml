# Publish config for Netlify. No build step — the site is static HTML, so the
# repository root is published as-is.
[build]
  publish = "."
  command = ""

# Filenames here are not content-hashed — there is no build step — so nothing
# can be cached as immutable: a fix to a .js or .css file would sit unseen in
# returning visitors' browsers until the cache expired. CSS and JS revalidate
# on every request (cheap: Netlify answers with a 304 when unchanged), and
# assets get a day rather than a year.
# pt-live-deployment was a meta-refresh stub pointing at the workflow builder.
# Serve it as a real 301 so search engines and browsers follow it properly.
[[redirects]]
  from = "/pages/pt-live-deployment.html"
  to = "/pages/pt-workflow-builder.html"
  status = 301

[[redirects]]
  from = "/pages/pt-live-deployment"
  to = "/pages/pt-workflow-builder.html"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Serve /pages/foo for /pages/foo.html so the URLs are shareable without the
# extension. Canonical tags still point at the .html form — change both together
# if the URL structure is revisited.
[[redirects]]
  from = "/pages/:slug"
  to = "/pages/:slug.html"
  status = 200

# Canonical host is the apex (innovent.io). Netlify redirects www to it at the
# domain level, so no redirect rule is needed here.
